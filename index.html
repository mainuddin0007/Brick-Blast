<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>RiseMoun Tech — Brick Blast 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:#07060f;
    font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    color:#e8e6ff;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #wrap{ position:fixed; inset:0; }
  canvas{ display:block; position:absolute; inset:0; touch-action:none; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:10px 12px calc(10px + env(safe-area-inset-top)) 12px;
    pointer-events:none;
    font-family:'Orbitron','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    z-index:5;
  }
  .hud-left, .hud-right{ display:flex; flex-direction:column; gap:5px; }
  .hud-right{ align-items:flex-end; }

  .hud-chip{
    display:flex; align-items:center; gap:6px;
    background:rgba(20,16,45,.62);
    border:1px solid rgba(120,110,220,.28);
    border-radius:9px;
    padding:3px 10px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .hud-chip span{ font-size:8.5px; letter-spacing:1.6px; color:#8f8ac9; font-weight:700; }
  .hud-chip b{ font-size:14px; color:#8ef4ff; font-weight:700; text-shadow:0 0 10px rgba(34,211,238,.55); }
  .hud-chip.sub b{ color:#ffd76a; font-size:11px; text-shadow:0 0 10px rgba(255,200,80,.45); }

  .hud-mid{
    display:flex; align-items:center; gap:5px;
    background:rgba(20,16,45,.62);
    border:1px solid rgba(167,139,250,.32);
    border-radius:9px;
    padding:3px 12px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .hud-mid span{ font-size:8.5px; letter-spacing:1.6px; color:#8f8ac9; font-weight:700; }
  .hud-mid b{ font-size:14px; color:#c9a6ff; font-weight:700; text-shadow:0 0 10px rgba(167,139,250,.55); }

  .lives{
    font-size:16px; letter-spacing:2px; color:#ff5f7e;
    text-shadow:0 0 12px rgba(255,80,120,.85);
    min-height:20px;
    padding:2px 6px;
  }

  #btn-pause, #btn-sound{
    pointer-events:auto;
    width:38px; height:38px; border-radius:11px;
    background:rgba(20,16,45,.55);
    border:1px solid rgba(120,110,220,.28);
    color:#bfe9ff; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:700;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  #btn-sound{ font-size:15px; margin-bottom:6px; }
  #btn-pause:active, #btn-sound:active{ transform:scale(.92); background:rgba(60,50,120,.8); }
  #btn-sound.off{ color:#666; border-color:rgba(120,110,220,.15); }

  .screen{
    position:absolute; inset:0; z-index:20;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:26px; text-align:center;
    background:
      radial-gradient(circle at 50% 35%, rgba(60,30,120,.55), transparent 62%),
      linear-gradient(160deg, rgba(7,6,15,.93), rgba(10,7,26,.97));
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
  }
  .screen.show{ display:flex; animation:screenIn .35s ease both; }
  @keyframes screenIn{ from{ opacity:0 } to{ opacity:1 } }

  #intro{ background: radial-gradient(circle at 50% 45%, #170d33 0%, #07060f 72%); }
  .intro-inner{ display:flex; flex-direction:column; align-items:center; }
  .intro-inner > *{ opacity:0; animation:riseIn .9s cubic-bezier(.16,.9,.25,1) forwards; }
  .intro-inner > *:nth-child(1){ animation-delay:.10s }
  .intro-inner > *:nth-child(2){ animation-delay:.55s }
  .intro-inner > *:nth-child(3){ animation-delay:.95s }
  .intro-inner > *:nth-child(4){ animation-delay:1.25s }
  .intro-inner > *:nth-child(5){ animation-delay:1.75s }
  .intro-inner > *:nth-child(6){ animation-delay:2.45s }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(22px) scale(.94); filter:blur(8px); }
    to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }

  .logo-mark{
    position:relative; width:96px; height:96px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
  }
  .ring{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid rgba(34,211,238,.55);
    border-top-color:rgba(34,211,238,1);
    box-shadow:0 0 22px rgba(34,211,238,.35), inset 0 0 22px rgba(34,211,238,.16);
    animation:spin 3.6s linear infinite;
  }
  .ring.r2{
    inset:11px;
    border-color:rgba(244,114,182,.42);
    border-bottom-color:rgba(244,114,182,1);
    box-shadow:0 0 18px rgba(244,114,182,.35), inset 0 0 18px rgba(244,114,182,.16);
    animation-duration:5.2s; animation-direction:reverse;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .logo-letter{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:900; font-size:38px;
    background:linear-gradient(180deg,#9df6ff,#a78bfa 60%,#f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(140,180,255,.5);
  }
  .brand{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:900;
    font-size:clamp(22px,7.5vw,34px); letter-spacing:2px;
    background:linear-gradient(90deg,#7dd3fc,#a78bfa 45%,#f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(140,130,255,.55));
  }
  .brand span{ font-weight:500; }
  .tagline{
    font-size:11px; letter-spacing:6px; color:#6f6aa8;
    margin-top:2px; margin-bottom:22px; text-transform:uppercase;
  }
  .game-title{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:900;
    font-size:clamp(28px,10vw,46px); letter-spacing:2px; line-height:1.05;
    color:#eef2ff;
    text-shadow:0 0 26px rgba(34,211,238,.6), 0 0 60px rgba(167,139,250,.45);
  }
  .game-title span{
    background:linear-gradient(90deg,#ffd76a,#ff7ab6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tap-hint{
    margin-top:34px; font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif;
    font-size:11px; letter-spacing:4px; color:#8ef4ff;
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
  .panel{ display:flex; flex-direction:column; align-items:center; width:100%; max-width:340px; }
  .title-big{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:900;
    font-size:clamp(26px,9vw,40px); letter-spacing:1px; line-height:1.05;
    color:#eef2ff;
    text-shadow:0 0 26px rgba(34,211,238,.55), 0 0 55px rgba(167,139,250,.4);
  }
  .title-big span{
    background:linear-gradient(90deg,#ffd76a,#ff7ab6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .byline{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-size:9.5px; letter-spacing:3.6px;
    color:#7b76b8; margin-top:8px; margin-bottom:20px;
  }
  .hi-badge{
    display:flex; align-items:center; gap:10px;
    padding:7px 18px; border-radius:999px; margin-bottom:22px;
    background:linear-gradient(90deg, rgba(255,190,60,.12), rgba(255,120,180,.12));
    border:1px solid rgba(255,200,90,.32);
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-size:10px; letter-spacing:2.4px; color:#ffd76a;
  }
  .hi-badge b{ font-size:15px; color:#fff4c9; text-shadow:0 0 12px rgba(255,210,90,.7); }
  .btn{
    width:100%; padding:14px 18px; margin-bottom:11px;
    border:none; border-radius:14px;
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:700;
    font-size:13px; letter-spacing:2.6px;
    color:#d8d4ff;
    background:rgba(30,24,64,.85);
    border:1px solid rgba(130,120,230,.32);
    transition:transform .12s ease, box-shadow .2s ease, background .2s;
    cursor:pointer;
  }
  .btn:active{ transform:scale(.965); }
  .btn.primary{
    color:#04121a;
    background:linear-gradient(100deg,#5eead4,#38bdf8 45%,#a78bfa);
    border:none;
    box-shadow:0 8px 26px rgba(56,189,248,.35), 0 0 0 1px rgba(255,255,255,.12) inset;
  }
  .btn.gold{
    color:#231402;
    background:linear-gradient(100deg,#ffd76a,#ff9d4d);
    border:none;
    box-shadow:0 8px 26px rgba(255,180,70,.32);
  }
  .btn.ghost{ background:transparent; border-color:rgba(130,120,230,.22); color:#8b86c9; font-size:11px; }
  .btn[disabled]{ opacity:.32; pointer-events:none; }
  .over-score{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-weight:900;
    font-size:clamp(44px,17vw,72px); line-height:1;
    color:#8ef4ff;
    text-shadow:0 0 30px rgba(34,211,238,.65), 0 0 70px rgba(34,211,238,.3);
    margin:6px 0 4px;
  }
  .over-sub{ font-size:11px; letter-spacing:4px; color:#7b76b8; margin-bottom:20px; }
  .record{
    font-family:'Orbitron','Segoe UI',system-ui,Arial,sans-serif; font-size:11px; letter-spacing:3px;
    color:#ffd76a; margin-bottom:16px; display:none;
    animation:pulse 1.1s ease-in-out infinite;
  }
  .record.show{ display:block; }
  .menu-actions{ width:100%; }
  .hint{
    margin-top:14px; font-size:11.5px; letter-spacing:1.5px; color:#5f5a94; line-height:1.7;
  }
  .hint b{ color:#8ef4ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div class="hud-chip"><span>SCORE</span><b id="hud-score">0</b></div>
      <div class="hud-chip sub"><span>BEST</span><b id="hud-best">0</b></div>
    </div>
    <div class="hud-mid">
      <span>LV</span><b id="hud-level">1</b>
    </div>
    <div class="hud-right">
      <button id="btn-sound" aria-label="Sound">🔊</button>
      <button id="btn-pause" aria-label="Pause">❚❚</button>
      <div class="lives" id="hud-lives">♥♥♥</div>
    </div>
  </div>

  <div id="intro" class="screen show">
    <div class="intro-inner">
      <div class="logo-mark">
        <div class="ring"></div>
        <div class="ring r2"></div>
        <div class="logo-letter">R</div>
      </div>
      <div class="brand">RiseMoun<span>Tech</span></div>
      <div class="tagline">Presents</div>
      <div class="game-title">BRICK <span>BLAST 3D</span></div>
      <div class="tap-hint">TAP TO CONTINUE</div>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="panel">
      <div class="title-big">BRICK <span>BLAST</span></div>
      <div class="byline">3D · BY RISEMOUN TECH</div>
      <div class="hi-badge">HIGH SCORE <b id="menu-high">0</b></div>
      <div class="menu-actions">
        <button class="btn primary" id="btn-new">NEW GAME</button>
        <button class="btn gold" id="btn-resume">CONTINUE</button>
      </div>
      <div class="hint">
        Drag your finger to move the paddle<br>
        Tap to fire lasers when you have the laser power-up
      </div>
    </div>
  </div>

  <div id="pause" class="screen">
    <div class="panel">
      <div class="title-big" style="font-size:clamp(22px,7vw,30px)">PAUSED</div>
      <div class="byline">RISEMOUN TECH 3D</div>
      <div class="hi-badge" style="margin-top:14px">SCORE <b id="pause-score">0</b></div>
      <div class="menu-actions">
        <button class="btn primary" id="btn-play">RESUME</button>
        <button class="btn" id="btn-restart2">NEW GAME</button>
        <button class="btn ghost" id="btn-menu2">MAIN MENU</button>
      </div>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="panel">
      <div class="title-big" style="font-size:clamp(24px,8vw,34px); color:#ff6b8b; text-shadow:0 0 28px rgba(255,80,120,.6)">GAME OVER</div>
      <div class="over-score" id="over-score">0</div>
      <div class="over-sub">FINAL SCORE</div>
      <div class="record" id="over-record">★ NEW RECORD ★</div>
      <div class="hi-badge" style="margin-bottom:20px">BEST <b id="over-high">0</b></div>
      <div class="menu-actions">
        <button class="btn gold" id="btn-continue">CONTINUE (<span id="cont-left">2</span>)</button>
        <button class="btn primary" id="btn-restart">NEW GAME</button>
        <button class="btn ghost" id="btn-menu3">MAIN MENU</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;

const ROW_COLORS = ['#ff4d6d','#ff8a3d','#ffd23f','#4ade80','#38bdf8','#a78bfa','#f472b6'];
const BASE_PADDLE_W = 112;
const PADDLE_H      = 13;
const BALL_R        = 7.5;
const BASE_SPEED    = 5.0;
const TOP_OFFSET    = 120;
const BRICK_DEPTH   = 5;

const POWERS = {
  wide : { color:'#38bdf8', label:'W', name:'WIDE PADDLE' },
  multi: { color:'#a78bfa', label:'M', name:'MULTI BALL'  },
  slow : { color:'#34d399', label:'S', name:'SLOW MOTION' },
  laser: { color:'#fbbf24', label:'L', name:'LASER GUN'   },
  life : { color:'#f87171', label:'♥', name:'EXTRA LIFE'  },
  score: { color:'#fb923c', label:'★', name:'+500 BONUS'  }
};
const POWER_KEYS = Object.keys(POWERS);

const G = {
  screen : 'intro',
  score  : 0,
  high   : 0,
  lives  : 3,
  level  : 1,
  continues : 2,
  paddle : { x:0, y:0, w:BASE_PADDLE_W, h:PADDLE_H, cx:0 },
  balls  : [], bricks : [], powers : [], lasers : [], parts : [],
  effects : { wide:0, slow:0, laser:0 },
  laserCD : 0, launchDelay : 0, pendingLevelUp : false,
  shake : 0, toastText : '', toastTime : 0, time : 0
};

let newRecord = false;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rnd   = (a,b)=> a + Math.random()*(b-a);

function roundRect(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

let audioCtx = null;
let soundOn = true;

function beep(freq, dur, type, vol, freq2){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if(freq2) o.frequency.exponentialRampToValueAtTime(freq2, t + dur);
    g.gain.setValueAtTime(vol || 0.045, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

function noise(dur, vol){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const size = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0; i<size; i++) data[i] = (Math.random()*2 - 1) * (1 - i/size);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start(t); src.stop(t + dur);
  }catch(e){}
}

const SFX = {
  paddle : ()=> beep(440, 0.05, 'square', 0.05),
  wall   : ()=> beep(300, 0.035,'square', 0.03),
  brick  : ()=> beep(680, 0.06, 'square', 0.045),
  hard   : ()=> beep(220, 0.05, 'sawtooth',0.035),
  life   : ()=> beep(160, 0.25,'sawtooth',0.06),
  laser  : ()=>{ noise(0.06, 0.05); beep(1400, 0.04, 'sawtooth', 0.03); },
  over   : ()=>{
    beep(300,0.15,'sawtooth',0.07);
    setTimeout(()=>beep(200,0.20,'sawtooth',0.07),150);
    setTimeout(()=>beep(120,0.35,'sawtooth',0.07),320);
  },
  level  : ()=>{
    beep(600,0.08,'sine',0.06);
    setTimeout(()=>beep(800,0.08,'sine',0.06),90);
    setTimeout(()=>beep(1100,0.14,'sine',0.06),180);
  },
  powerWide : ()=>{ beep(300, 0.20, 'sine', 0.07, 900); },
  powerMulti: ()=>{
    beep(700,0.07,'square',0.06);
    setTimeout(()=>beep(900,0.07,'square',0.06),70);
    setTimeout(()=>beep(1100,0.07,'square',0.06),140);
  },
  powerSlow : ()=>{ beep(900, 0.30, 'sine', 0.07, 250); },
  powerLaser: ()=>{ noise(0.08, 0.06); beep(1800, 0.10, 'sawtooth', 0.05, 400); },
  powerLife : ()=>{
    beep(660,0.10,'sine',0.07);
    setTimeout(()=>beep(880,0.10,'sine',0.07),100);
    setTimeout(()=>beep(1320,0.18,'sine',0.07),200);
  },
  powerScore: ()=>{
    beep(1200,0.05,'square',0.06);
    setTimeout(()=>beep(1600,0.10,'square',0.06),50);
  },
  powerDefault: ()=>{ beep(760,0.07,'sine',0.07); setTimeout(()=>beep(1080,0.10,'sine',0.07),70); }
};

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  G.paddle.y = H - 74;
  if(!G.paddle.cx) G.paddle.cx = W/2;
  G.paddle.cx = clamp(G.paddle.cx, G.paddle.w/2, W - G.paddle.w/2);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 120));

function buildLevel(lv){
  G.bricks = [];
  const cols   = 8;
  const rows   = Math.min(3 + lv, 7);
  const margin = 12;
  const gap    = 6;
  const bh     = 24;
  const bw     = (W - margin*2 - gap*(cols-1)) / cols;
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      let hp = 1;
      if(lv >= 3 && r === 0) hp = 2;
      if(lv >= 5 && r <= 1) hp = 2;
      if(lv >= 7 && r === 0) hp = 3;
      G.bricks.push({
        x: margin + c*(bw+gap),
        y: TOP_OFFSET + r*(bh+gap),
        w: bw, h: bh,
        hp: hp, maxHp: hp,
        alive: true,
        ci: r % ROW_COLORS.length,
        flash: 0
      });
    }
  }
}

function resetBall(){
  G.balls = [{
    x: G.paddle.x + G.paddle.w/2,
    y: G.paddle.y - BALL_R - 2,
    r: BALL_R, dx:0, dy:0, launched:false
  }];
  G.launchDelay = 750;
  G.lasers = [];
}

function launchBall(b){
  const sp  = BASE_SPEED + (G.level - 1) * 0.22;
  const ang = -Math.PI/2 + rnd(-0.42, 0.42);
  b.dx = Math.cos(ang) * sp;
  b.dy = Math.sin(ang) * sp;
  b.launched = true;
}

function newGame(){
  G.score = 0; G.lives = 3; G.level = 1; G.continues = 2;
  G.effects = { wide:0, slow:0, laser:0 };
  G.laserCD = 0;
  G.paddle.w = BASE_PADDLE_W;
  G.paddle.cx = W/2;
  G.paddle.x = clamp(G.paddle.cx - G.paddle.w/2, 6, W - G.paddle.w - 6);
  G.powers = []; G.lasers = []; G.parts = [];
  G.shake = 0; G.pendingLevelUp = false; newRecord = false;
  buildLevel(1);
  resetBall();
  G.screen = 'playing';
  showScreen(null);
  updateHUD();
}

function saveGame(){
  try{
    localStorage.setItem('rmt_save', JSON.stringify({
      score: G.score, lives: G.lives, level: G.level,
      continues: G.continues,
      bricks: G.bricks.map(b=>({
        x:b.x, y:b.y, w:b.w, h:b.h,
        hp:b.hp, maxHp:b.maxHp, alive:b.alive, ci:b.ci
      }))
    }));
  }catch(e){}
}
function hasSave(){
  try{ return !!localStorage.getItem('rmt_save'); }catch(e){ return false; }
}
function loadGame(){
  try{
    const raw = localStorage.getItem('rmt_save');
    if(!raw) return false;
    const s = JSON.parse(raw);
    G.score = s.score; G.lives = s.lives; G.level = s.level;
    G.continues = (s.continues === undefined) ? 2 : s.continues;
    G.bricks = s.bricks.map(b=>({
      x:b.x, y:b.y, w:b.w, h:b.h, hp:b.hp, maxHp:b.maxHp,
      alive:b.alive, ci:b.ci, flash:0
    }));
    G.effects = { wide:0, slow:0, laser:0 };
    G.paddle.w = BASE_PADDLE_W;
    G.paddle.cx = W/2;
    G.paddle.x = clamp(W/2 - G.paddle.w/2, 6, W - G.paddle.w - 6);
    G.powers = []; G.lasers = []; G.parts = [];
    G.shake = 0; G.pendingLevelUp = false; newRecord = false;
    resetBall();
    G.screen = 'playing';
    showScreen(null);
    updateHUD();
    return true;
  }catch(e){ return false; }
}
function clearSave(){
  try{ localStorage.removeItem('rmt_save'); }catch(e){}
}

const elScore = document.getElementById('hud-score');
const elBest  = document.getElementById('hud-best');
const elLevel = document.getElementById('hud-level');
const elLives = document.getElementById('hud-lives');

function updateHUD(){
  elScore.textContent = G.score;
  elBest.textContent  = G.high;
  elLevel.textContent = G.level;
  elLives.innerHTML   = G.lives > 0 ? '♥'.repeat(Math.min(G.lives,7)) : '';
}

const screens = {
  intro: document.getElementById('intro'),
  menu : document.getElementById('menu'),
  pause: document.getElementById('pause'),
  over : document.getElementById('over')
};
function showScreen(name){
  for(const k in screens) screens[k].classList.toggle('show', k === name);
}

function pauseGame(){
  if(G.screen !== 'playing') return;
  G.screen = 'paused'; saveGame();
  const ps = document.getElementById('pause-score');
  if(ps) ps.textContent = G.score;
  showScreen('pause');
}
function resumeGame(){
  if(G.screen !== 'paused') return;
  G.screen = 'playing'; showScreen(null);
}
function gameOver(){
  G.screen = 'over';
  if(G.score > G.high){
    G.high = G.score; newRecord = true;
    try{ localStorage.setItem('rmt_high', String(G.high)); }catch(e){}
  }
  clearSave(); updateHUD(); SFX.over();
  document.getElementById('over-score').textContent = G.score;
  document.getElementById('over-high').textContent  = G.high;
  document.getElementById('over-record').classList.toggle('show', newRecord);
  const cb = document.getElementById('btn-continue');
  document.getElementById('cont-left').textContent = G.continues;
  cb.disabled = G.continues <= 0;
  showScreen('over');
}
function continueGame(){
  if(G.continues <= 0) return;
  G.continues--; G.lives = 3;
  G.effects = { wide:0, slow:0, laser:0 };
  G.powers = []; G.lasers = []; G.parts = [];
  G.paddle.w = BASE_PADDLE_W;
  resetBall();
  G.screen = 'playing';
  showScreen(null);
  updateHUD();
  toast('CONTINUE!');
}
function toast(text){ G.toastText = text; G.toastTime = 1400; }

function spawnParticles(b){
  const col = ROW_COLORS[b.ci];
  for(let i=0; i<12; i++){
    const a = Math.random() * Math.PI * 2;
    const s = rnd(1.2, 5.5);
    G.parts.push({
      x: b.x + b.w/2, y: b.y + b.h/2,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, color: col, size: rnd(1.8, 4.5)
    });
  }
}
function maybeDropPower(b){
  if(Math.random() > 0.22) return;
  const key = POWER_KEYS[(Math.random()*POWER_KEYS.length)|0];
  G.powers.push({
    x: b.x + b.w/2, y: b.y + b.h/2,
    w: 32, h: 32, vy: 1.7, key: key, rot: 0
  });
}
function applyPower(key){
  switch(key){
    case 'wide' : SFX.powerWide();  G.effects.wide  = 13000; break;
    case 'slow' : SFX.powerSlow();  G.effects.slow  = 9000;  break;
    case 'laser': SFX.powerLaser(); G.effects.laser = 11000; break;
    case 'multi': SFX.powerMulti(); multiBall(); break;
    case 'life' : SFX.powerLife();  G.lives = Math.min(G.lives + 1, 7); break;
    case 'score': SFX.powerScore(); G.score += 500; break;
    default     : SFX.powerDefault(); break;
  }
  toast(POWERS[key].name);
  updateHUD();
}
function multiBall(){
  if(G.balls.length >= 6) return;
  const src = G.balls[0];
  if(!src || !src.launched) return;
  const baseAng = Math.atan2(src.dy, src.dx);
  const sp = Math.hypot(src.dx, src.dy) || BASE_SPEED;
  for(let i=0; i<2; i++){
    if(G.balls.length >= 6) break;
    const ang = baseAng + (i === 0 ? 0.55 : -0.55);
    G.balls.push({
      x: src.x, y: src.y, r: BALL_R,
      dx: Math.cos(ang)*sp, dy: Math.sin(ang)*sp,
      launched: true
    });
  }
}
function damageBrick(br){
  br.hp--; br.flash = 1;
  if(br.hp > 0){ SFX.hard(); G.shake = Math.min(G.shake + 1.4, 6); return; }
  br.alive = false;
  G.score += 10 * br.maxHp;
  spawnParticles(br); maybeDropPower(br);
  SFX.brick(); G.shake = Math.min(G.shake + 2.2, 8);
  updateHUD();
  if(G.bricks.every(b => !b.alive)) G.pendingLevelUp = true;
}
function collideWalls(b){
  if(b.x - b.r < 0){ b.x = b.r;     b.dx = Math.abs(b.dx);  SFX.wall(); }
  if(b.x + b.r > W){ b.x = W - b.r; b.dx = -Math.abs(b.dx); SFX.wall(); }
  if(b.y - b.r < 0){ b.y = b.r;     b.dy = Math.abs(b.dy);  SFX.wall(); }
}
function collidePaddle(b){
  const p = G.paddle;
  if(b.dy <= 0) return;
  if(b.y + b.r < p.y || b.y - b.r > p.y + p.h) return;
  if(b.x + b.r < p.x || b.x - b.r > p.x + p.w) return;
  b.y = p.y - b.r;
  const rel = clamp((b.x - (p.x + p.w/2)) / (p.w/2), -1, 1);
  const ang = rel * (Math.PI/3);
  const sp  = Math.max(Math.hypot(b.dx, b.dy), BASE_SPEED);
  b.dx = Math.sin(ang) * sp;
  b.dy = -Math.cos(ang) * sp;
  SFX.paddle();
}
function collideBricks(b){
  for(let i=0; i<G.bricks.length; i++){
    const br = G.bricks[i];
    if(!br.alive) continue;
    if(b.x + b.r < br.x || b.x - b.r > br.x + br.w) continue;
    if(b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;
    const ox = (b.r + br.w/2) - Math.abs(b.x - (br.x + br.w/2));
    const oy = (b.r + br.h/2) - Math.abs(b.y - (br.y + br.h/2));
    if(ox < oy){ b.dx = -b.dx; b.x += (b.x < br.x + br.w/2) ? -ox : ox; }
    else { b.dy = -b.dy; b.y += (b.y < br.y + br.h/2) ? -oy : oy; }
    damageBrick(br);
    break;
  }
}
function loseLife(){
  G.lives--;
  G.effects = { wide:0, slow:0, laser:0 };
  G.powers = []; G.lasers = [];
  updateHUD(); SFX.life(); G.shake = 10;
  if(G.lives <= 0){ gameOver(); }
  else{ G.paddle.w = BASE_PADDLE_W; resetBall(); toast('LIFE LOST'); }
}
function levelUp(){
  G.level++; G.score += 250; SFX.level();
  buildLevel(G.level);
  G.powers = []; G.lasers = [];
  G.effects = { wide:0, slow:0, laser:0 };
  G.paddle.w = BASE_PADDLE_W;
  resetBall(); updateHUD();
  toast('LEVEL ' + G.level);
  saveGame();
}
function fireLaser(){
  if(G.effects.laser <= 0 || G.laserCD > 0) return;
  G.laserCD = 260;
  const p = G.paddle;
  G.lasers.push({ x: p.x + 8,        y: p.y - 4, vy: -13 });
  G.lasers.push({ x: p.x + p.w - 8,  y: p.y - 4, vy: -13 });
  SFX.laser();
}

function shade(hex, amt){
  const h = hex.replace('#','');
  let r = parseInt(h.substring(0,2),16);
  let g = parseInt(h.substring(2,4),16);
  let b = parseInt(h.substring(4,6),16);
  r = clamp(Math.round(r + 255*amt), 0, 255);
  g = clamp(Math.round(g + 255*amt), 0, 255);
  b = clamp(Math.round(b + 255*amt), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function draw3DBackground(){
  const bg = ctx.createRadialGradient(W/2, H*0.25, 40, W/2, H*0.6, Math.max(W,H)*0.95);
  bg.addColorStop(0,   '#2a1855');
  bg.addColorStop(0.4, '#140a30');
  bg.addColorStop(0.7, '#0a0620');
  bg.addColorStop(1,   '#04020a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  const hg = ctx.createLinearGradient(0, H*0.30, 0, H*0.65);
  hg.addColorStop(0,   'rgba(140,90,240,0)');
  hg.addColorStop(0.45,'rgba(150,100,255,0.16)');
  hg.addColorStop(0.6, 'rgba(120,70,220,0.08)');
  hg.addColorStop(1,   'rgba(80,40,160,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, H*0.30, W, H*0.35);

  const tg = ctx.createLinearGradient(0, 0, 0, H*0.28);
  tg.addColorStop(0, 'rgba(7,6,15,0.85)');
  tg.addColorStop(1, 'rgba(7,6,15,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H*0.28);

  ctx.save();
  for(let i=0; i<26; i++){
    const sx = (i * 97 + 43) % W;
    const sy = (i * 137 + 61) % Math.floor(H * 0.65);
    const r = ((i * 7) % 3) * 0.6 + 0.4;
    const a = 0.15 + ((i * 13) % 10) / 40;
    ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(G.time * 0.03 + i));
    ctx.fillStyle = i % 4 === 0 ? '#a5b4fc' : '#e0e7ff';
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  const vg = ctx.createLinearGradient(0, H*0.75, 0, H);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, H*0.75, W, H*0.25);
}

function draw3DBrick(br){
  const col  = ROW_COLORS[br.ci];
  let baseCol = col;
  let lightCol = shade(col, 0.32);
  let darkCol  = shade(col, -0.38);

  if(br.maxHp >= 3){
    baseCol = '#94a3b8';
    lightCol = '#e5e7eb';
    darkCol = '#4b5563';
  } else if(br.maxHp === 2){
    baseCol = col;
    lightCol = '#fff1c9';
    darkCol = shade(col, -0.5);
  }

  const x = br.x, y = br.y, w = br.w, h = br.h;
  const d = BRICK_DEPTH;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, x + 4, y + h - 1, w - 2, d + 4, 4);
  ctx.fill();

  ctx.fillStyle = darkCol;
  ctx.beginPath();
  ctx.moveTo(x + w, y);
  ctx.lineTo(x + w - d, y - d);
  ctx.lineTo(x + w - d, y + h - d);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = lightCol;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w - d, y - d);
  ctx.lineTo(x - d, y - d);
  ctx.closePath();
  ctx.fill();

  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, lightCol);
  g.addColorStop(0.45, baseCol);
  g.addColorStop(1, darkCol);
  ctx.fillStyle = g;
  roundRect(ctx, x, y, w, h, 5);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(ctx, x + 2, y + 2, w - 4, h * 0.32, 4);
  ctx.fill();

  ctx.save();
  ctx.shadowColor = col;
  ctx.shadowBlur = 9;
  ctx.strokeStyle = shade(col, 0.4);
  ctx.lineWidth = 1;
  roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 5);
  ctx.stroke();
  ctx.restore();

  if(br.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (br.flash * 0.8) + ')';
    roundRect(ctx, x, y, w, h, 5);
    ctx.fill();
  }
}

function draw3DBall(b){
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(b.x + 4, b.y + b.r - 1, b.r * 1.1, b.r * 0.4, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 22;
  const g = ctx.createRadialGradient(
    b.x - b.r * 0.4, b.y - b.r * 0.4, b.r * 0.1,
    b.x, b.y, b.r
  );
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.25, '#c8f6ff');
  g.addColorStop(0.55, '#4fc3ff');
  g.addColorStop(0.85, '#1e40af');
  g.addColorStop(1, '#0b1230');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.28, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(140,220,255,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r - 0.5, 0, Math.PI*2);
  ctx.stroke();
}

function draw3DPaddle(p){
  const isLaser = G.effects.laser > 0;
  const baseCol = isLaser ? '#fbbf24' : '#38bdf8';
  const lightCol = isLaser ? '#fff3b0' : '#a5f3fc';
  const darkCol  = isLaser ? '#7c2d12' : '#4c1d95';
  const d = 4;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, p.x + 3, p.y + p.h - 1, p.w, d + 4, p.h/2);
  ctx.fill();

  ctx.fillStyle = darkCol;
  ctx.beginPath();
  ctx.moveTo(p.x + p.w, p.y);
  ctx.lineTo(p.x + p.w - d, p.y - d);
  ctx.lineTo(p.x + p.w - d, p.y + p.h - d);
  ctx.lineTo(p.x + p.w, p.y + p.h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = lightCol;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.w, p.y);
  ctx.lineTo(p.x + p.w - d, p.y - d);
  ctx.lineTo(p.x - d, p.y - d);
  ctx.closePath();
  ctx.fill();

  ctx.save();
  ctx.shadowColor = baseCol;
  ctx.shadowBlur = 20;
  const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  g.addColorStop(0, lightCol);
  g.addColorStop(0.5, baseCol);
  g.addColorStop(1, darkCol);
  ctx.fillStyle = g;
  roundRect(ctx, p.x, p.y, p.w, p.h, p.h/2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  roundRect(ctx, p.x + 4, p.y + 2, p.w - 8, 3, 2);
  ctx.fill();

  if(isLaser){
    ctx.fillStyle = '#fde68a';
    ctx.fillRect(p.x + 6, p.y - 6, 4, 6);
    ctx.fillRect(p.x + p.w - 10, p.y - 6, 4, 6);
  }
}

function draw3DPower(pw){
  const info = POWERS[pw.key];

  ctx.fill();

  ctx.fillStyle = shade(info.color, -0.45);
  ctx.beginPath();
  ctx.moveTo(pw.w/2, -pw.h/2);
  ctx.lineTo(pw.w/2 - d, -pw.h/2 - d);
  ctx.lineTo(pw.w/2 - d, pw.h/2 - d);
  ctx.lineTo(pw.w/2, pw.h/2);
  ctx.closePath();

  ctx.fillStyle = shade(info.color, 0.35);
  ctx.beginPath();

  ctx.lineTo(pw.w/2, -pw.h/2);
  ctx.lineTo(pw.w/2 - d, -pw.h/2 - d);
  ctx.lineTo(-pw.w/2 - d, -pw.h/2 - d);
  ctx.closePath();
  ctx.fill();

  ctx.shadowColor = info.color;
  ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(0, -pw.h/2, 0, pw.h/2);
  g.addColorStop(0, shade(info.color, 0.15));
  g.addColorStop(1, shade(info.color, -0.3));
  ctx.fillStyle = g;
  roundRect(ctx, -pw.w/2, -pw.h/2, pw.w, pw.h, 8);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = '700 16px Orbitron, "Segoe UI", system-ui, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(info.label, 0, 1);
  ctx.restore();
}

function update(dt){
  if(G.screen !== 'playing') return;
  G.time += dt;
  const ms = dt * 16.6667;

  for(const k in G.effects){
    if(G.effects[k] > 0){ G.effects[k] -= ms; if(G.effects[k] < 0) G.effects[k] = 0; }
  }
  if(G.laserCD > 0) G.laserCD -= ms;
  if(G.shake > 0)   G.shake = Math.max(0, G.shake - 0.45 * dt);
  if(G.toastTime > 0) G.toastTime -= ms;

  const targetW = BASE_PADDLE_W * (G.effects.wide > 0 ? 1.75 : 1);
  G.paddle.w += (targetW - G.paddle.w) * Math.min(1, 0.18 * dt);
  G.paddle.x = clamp(G.paddle.cx - G.paddle.w/2, 4, W - G.paddle.w - 4);

  for(let i=G.parts.length-1; i>=0; i--){
    const p = G.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.16 * dt; p.vx *= 0.99;
    p.life -= 0.028 * dt;
    if(p.life <= 0) G.parts.splice(i,1);
  }
  for(const br of G.bricks){
    if(br.flash > 0) br.flash = Math.max(0, br.flash - 0.08 * dt);
  }
  if(G.launchDelay > 0){
    G.launchDelay -= ms;
    for(const b of G.balls){
      if(!b.launched){
        b.x = G.paddle.x + G.paddle.w/2;
        b.y = G.paddle.y - b.r - 2;
      }
    }
    if(G.launchDelay <= 0){
      for(const b of G.balls) if(!b.launched) launchBall(b);
    }
  }
  const slowMul = G.effects.slow > 0 ? 0.55 : 1;
  for(let i=G.balls.length-1; i>=0; i--){
    const b = G.balls[i];
    if(!b.launched) continue;
    const mx = b.dx * dt * slowMul;
    const my = b.dy * dt * slowMul;
    const dist  = Math.hypot(mx, my);
    const steps = Math.max(1, Math.ceil(dist / (b.r * 0.75)));
    for(let s=0; s<steps; s++){
      b.x += mx / steps; b.y += my / steps;
      collideWalls(b); collidePaddle(b); collideBricks(b);
      if(b.y - b.r > H + 20) break;
    }
    if(b.y - b.r > H + 20) G.balls.splice(i,1);
  }
  for(let i=G.lasers.length-1; i>=0; i--){
    const l = G.lasers[i];
    l.y += l.vy * dt;
    if(l.y < -20){ G.lasers.splice(i,1); continue; }
    let hit = false;
    for(const br of G.bricks){
      if(!br.alive) continue;
      if(l.x > br.x && l.x < br.x + br.w && l.y < br.y + br.h && l.y > br.y){
        damageBrick(br); hit = true; break;
      }
    }
    if(hit) G.lasers.splice(i,1);
  }
  const p = G.paddle;
  for(let i=G.powers.length-1; i>=0; i--){
    const pw = G.powers[i];
    pw.y += pw.vy * dt; pw.rot += 0.06 * dt;
    if(pw.y + pw.h/2 > p.y && pw.y - pw.h/2 < p.y + p.h &&
       pw.x + pw.w/2 > p.x && pw.x - pw.w/2 < p.x + p.w){
      applyPower(pw.key); G.powers.splice(i,1); continue;
    }
    if(pw.y - pw.h/2 > H) G.powers.splice(i,1);
  }
  if(G.pendingLevelUp){ G.pendingLevelUp = false; levelUp(); return; }
  if(G.balls.length === 0 && G.launchDelay <= 0){ loseLife(); }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  draw3DBackground();

  ctx.save();
  if(G.shake > 0.2){
    ctx.translate(rnd(-G.shake,G.shake)*0.7, rnd(-G.shake,G.shake)*0.7);
  }

  for(const br of G.bricks){
    if(!br.alive) continue;
    draw3DBrick(br);
  }
  for(const pw of G.powers){
    draw3DPower(pw);
  }
  for(const l of G.lasers){
    ctx.save();
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 14;
    const lg = ctx.createLinearGradient(l.x, l.y - 18, l.x, l.y);
    lg.addColorStop(0, 'rgba(255,243,176,0)');
    lg.addColorStop(0.5, '#fff3b0');
    lg.addColorStop(1, '#fbbf24');
    ctx.fillStyle = lg;
    ctx.fillRect(l.x - 1.8, l.y - 18, 3.6, 20);
    ctx.restore();
  }
  for(const p of G.parts){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  if(G.screen === 'playing' || G.screen === 'paused'){
    draw3DPaddle(G.paddle);
  }
  for(const b of G.balls){
    draw3DBall(b);
  }
  ctx.restore();

  drawEffectBar();

  if(G.toastTime > 0){
    const a = Math.min(1, G.toastTime / 350);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 20px Orbitron, "Segoe UI", system-ui, Arial, sans-serif';
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#e0f7ff';
    ctx.fillText(G.toastText, W/2, H * 0.42);
    ctx.restore();
  }
}

function drawEffectBar(){
  const items = [];
  if(G.effects.wide  > 0) items.push(['WIDE',  G.effects.wide  / 13000, '#38bdf8']);
  if(G.effects.slow  > 0) items.push(['SLOW',  G.effects.slow  / 9000,  '#34d399']);
  if(G.effects.laser > 0) items.push(['LASER', G.effects.laser / 11000, '#fbbf24']);
  if(!items.length) return;
  const bw = 78, bh = 6, gap = 8;
  const totalW = items.length * bw + (items.length-1) * gap;
  let x = (W - totalW) / 2;
  const y = H - 32;
  for(const [label, ratio, color] of items){
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(ctx, x, y, bw, bh, 3); ctx.fill();
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    roundRect(ctx, x, y, bw * clamp(ratio,0,1), bh, 3); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(220,230,255,0.75)';
    ctx.font = '600 8px Orbitron, "Segoe UI", system-ui, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + bw/2, y - 5);
    ctx.restore();
    x += bw + gap;
  }
}

let lastT = 0;
function loop(t){
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 16.6667;
  lastT = t;
  dt = clamp(dt, 0, 3);
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function toLocal(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointermove', function(e){
  if(G.screen !== 'playing') return;
  e.preventDefault();
  G.paddle.cx = clamp(toLocal(e).x, 0, W);
}, { passive:false });
canvas.addEventListener('pointerdown', function(e){
  if(G.screen !== 'playing') return;
  e.preventDefault();
  G.paddle.cx = clamp(toLocal(e).x, 0, W);
  if(G.effects.laser > 0) fireLaser();
}, { passive:false });
const keys = {};
window.addEventListener('keydown', function(e){
  keys[e.key] = true;
  if(e.key === ' ' && G.screen === 'playing'){
    e.preventDefault(); fireLaser();
  }
  if(e.key === 'Escape' || e.key === 'p' || e.key === 'P'){
    if(G.screen === 'playing') pauseGame();
    else if(G.screen === 'paused') resumeGame();
  }
});
window.addEventListener('keyup', function(e){ keys[e.key] = false; });
const origUpdate = update;
update = function(dt){
  if(G.screen === 'playing'){
    const spd = 9 * dt;
    if(keys['ArrowLeft']  || keys['a'] || keys['A']) G.paddle.cx = clamp(G.paddle.cx - spd, 0, W);
    if(keys['ArrowRight'] || keys['d'] || keys['D']) G.paddle.cx = clamp(G.paddle.cx + spd, 0, W);
  }
  origUpdate(dt);
};

document.getElementById('intro').addEventListener('pointerdown', function(){
  showScreen('menu'); refreshMenu();
});
function refreshMenu(){
  document.getElementById('menu-high').textContent = G.high;
  const rb = document.getElementById('btn-resume');
  rb.disabled = !hasSave();
}
document.getElementById('btn-new').addEventListener('click', function(){
  clearSave(); newGame();
});
document.getElementById('btn-resume').addEventListener('click', function(){
  if(!loadGame()) newGame();
});
document.getElementById('btn-pause').addEventListener('click', function(){
  if(G.screen === 'playing') pauseGame();
  else if(G.screen === 'paused') resumeGame();
});
document.getElementById('btn-play').addEventListener('click', resumeGame);
document.getElementById('btn-restart2').addEventListener('click', function(){
  clearSave(); newGame();
});
document.getElementById('btn-menu2').addEventListener('click', function(){
  G.screen = 'menu'; showScreen('menu'); refreshMenu();
});
document.getElementById('btn-continue').addEventListener('click', continueGame);
document.getElementById('btn-restart').addEventListener('click', function(){
  clearSave(); newGame();
});
document.getElementById('btn-menu3').addEventListener('click', function(){
  G.screen = 'menu'; showScreen('menu'); refreshMenu();
});

const btnSound = document.getElementById('btn-sound');
try{
  const saved = localStorage.getItem('rmt_sound');
  if(saved === '0') soundOn = false;
}catch(e){}
function refreshSoundBtn(){
  if(!btnSound) return;
  btnSound.textContent = soundOn ? '🔊' : '🔇';
  btnSound.classList.toggle('off', !soundOn);
}
if(btnSound){
  btnSound.addEventListener('click', function(){
    soundOn = !soundOn;
    try{ localStorage.setItem('rmt_sound', soundOn ? '1' : '0'); }catch(e){}
    refreshSoundBtn();
    if(soundOn) beep(880, 0.08, 'sine', 0.06);
  });
}
refreshSoundBtn();

function boot(){
  resize();
  try{ G.high = parseInt(localStorage.getItem('rmt_high') || '0', 10) || 0; }catch(e){ G.high = 0; }
  G.paddle.cx = W/2;
  G.paddle.x  = W/2 - G.paddle.w/2;
  buildLevel(1);
  resetBall();
  updateHUD();
  refreshMenu();
  refreshSoundBtn();
  requestAnimationFrame(loop);
}
boot();
})();
</script>
